# general settings
name: LOLv2-Real_captured
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: lolv2-train
    type: PairedImageDataset
    dataroot_gt: data/datasets/LOL-v2/Real_captured/train/Normal
    dataroot_lq: data/datasets/LOL-v2/Real_captured/train/Low

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8      # 充分利用 10 核 CPU
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: lolv2-test
    type: PairedImageDataset
    dataroot_gt: data/datasets/LOL-v2/Real_captured/test/Normal
    dataroot_lq: data/datasets/LOL-v2/Real_captured/test/Low
    io_backend:
      type: disk


network_g:
  type: DarkIR
  width: 32
  middle_blk_num_enc: 2
  middle_blk_num_dec: 2
  enc_blk_nums: [ 1, 2, 3 ]
  dec_blk_nums: [ 3, 1, 1 ]
  dilations: [ 1, 4, 9 ]
  extra_depth_wise: True

# path
path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 2e-4  #建议修改，学习率稍微降低（Real 更难训）
    weight_decay: !!float 1e-4 # 适当的权重衰减防止过拟合
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 400000
    eta_min: !!float 1e-7

  total_iter: 400000
  warmup_iter: 5000            # 增加预热步数，让模型慢慢适应真实噪声分布

# losses
pixel_criterion: l1

# 冲击高分的关键：增强感知损失约束，有助于提升 SSIM 和视觉细节
perceptual: True
perceptual_weight: 0.1         # 权重从 0.01 提到 0.1
perceptual_criterion: l1
perceptual_reduction: mean

# 降低边缘损失权重。Real 数据集噪声大，权重太高会让模型去“还原”噪声边缘
edge: True
edge_weight: 5
edge_criterion: l2
edge_reduction: mean

enhance: True
enhance_weight: 1
enhance_criterion: l1
enhance_reduction: mean

# validation settings
val:
  val_freq: 200
  save_img: false


  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500